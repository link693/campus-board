name: Deploy to GitHub Pages

# 本作品是零构建的纯静态站点，因此这里不需要安装依赖或执行构建，
# 直接把仓库内容作为静态资源发布即可。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: 校验数据与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 运行自动化测试
        run: node tests/run-all.js

      - name: 校验数据集与题目原文一致
        run: python tools/build_dataset.py --check

  deploy:
    name: 发布到 Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: 打包静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          # 只发布运行所需的前端资源，工具链与测试不进入站点
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
